spring.application.name=warehouse

# Hosting platforms assign the port at runtime and inject it as PORT; a hard
# 8080 makes their health checks fail because nothing answers on the port they
# probe. Falls back to 8080 when PORT is absent, which is the local case.
server.port=${PORT:8080}

# Supabase/Postgres is the default target - see application-supabase.properties,
# which overrides every datasource key below.
#
# The H2 block is kept as the offline fallback. Reach it by dropping this profile
# on the command line: -Dspring.profiles.active=default (or an empty value),
# which leaves only the settings in this file active.
spring.profiles.active=supabase

# --- Offline fallback (H2 in-memory) ---
# Uses an in-memory H2 database so the app can run without an external DB.
spring.datasource.url=jdbc:h2:mem:warehouse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Keep schema transient for local dev; switch to a prod profile for persistence
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Surface the real exception message and validation details in error responses
# instead of a bare status code. See the note in application-supabase.properties
# before running this config against anything user-facing.
server.error.include-message=always
server.error.include-binding-errors=always

# To run against Supabase/Postgres use the 'supabase' profile: -Dspring.profiles.active=supabase