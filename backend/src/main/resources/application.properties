spring.application.name=warehouse

# --- Local development (H2 in-memory) ---
# Uses an in-memory H2 database so the app can run without an external DB.
spring.datasource.url=jdbc:h2:mem:warehouse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Keep schema transient for local dev; switch to a prod profile for persistence
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Surface the real exception message and validation details in error responses
# instead of a bare status code. See the note in application-supabase.properties
# before running this config against anything user-facing.
server.error.include-message=always
server.error.include-binding-errors=always

# To run against Supabase/Postgres use the 'supabase' profile: -Dspring.profiles.active=supabase