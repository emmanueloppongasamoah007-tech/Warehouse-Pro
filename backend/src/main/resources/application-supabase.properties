spring.application.name=warehouse

# --- Supabase PostgreSQL ---
spring.datasource.url=jdbc:postgresql://aws-0-eu-central-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.aboijzdngtaudcqxjmss
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# This is the default profile (activated in application.properties), so a plain
# `mvnw spring-boot:run` lands here. Requires the DB_PASSWORD environment
# variable; startup fails fast if it is unset.

# Error detail is switched back off rather than merely left unset. Spring always
# loads application.properties as the base, and that file turns
# server.error.include-message on for H2 dev - so omitting it here would inherit
# it, leaking exception text from the real database into API responses.
server.error.include-message=never
server.error.include-binding-errors=never
